apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-agents-frontend
  namespace: ai-agents
spec:
  replicas: 1
  selector:
    matchLabels: { app: ai-agents-frontend }
  template:
    metadata:
      labels: { app: ai-agents-frontend }
    spec:
      containers:
        - name: frontend
          image: nginx:1.27-alpine
          ports:
            - containerPort: 8080
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
          volumeMounts:
            - { name: html, mountPath: /usr/share/nginx/html/index.html, subPath: index.html }
            - { name: html, mountPath: /usr/share/nginx/html/style.css, subPath: style.css }
            - { name: html, mountPath: /usr/share/nginx/html/app.js, subPath: app.js }
            - { name: nginx-conf, mountPath: /etc/nginx/conf.d/default.conf, subPath: nginx.conf }
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 5
      volumes:
        - name: html
          configMap: { name: ai-agents-frontend-src }
        - name: nginx-conf
          configMap: { name: ai-agents-frontend-nginx-conf }
---
apiVersion: v1
kind: Service
metadata:
  name: ai-agents-frontend
  namespace: ai-agents
  annotations:
    # The AWS Classic ELB this provisions has its OWN idle timeout,
    # default 60s, independent of nginx's proxy_read_timeout -- it was
    # silently killing the connection at 60s regardless of what nginx or
    # the app allowed. CPU-only inference on the self-hosted 27B model
    # needs headroom past that.
    service.beta.kubernetes.io/aws-load-balancer-connection-idle-timeout: "180"
spec:
  type: LoadBalancer
  selector: { app: ai-agents-frontend }
  ports:
    - port: 80
      targetPort: 8080
