server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # CPU-only inference on the self-hosted 27B model can genuinely take
    # 1-3 minutes for a full prompt -- well past nginx's 60s default.
    # Applies to every route; harmless for the fast ones.
    proxy_connect_timeout 180s;
    proxy_send_timeout 180s;
    proxy_read_timeout 180s;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Each location strips its own prefix and forwards to the matching
    # backend Service (ClusterIP, same "ai-agents" namespace) -- so the
    # browser only ever talks to this one origin.
    # More specific than the block below, so nginx matches this first
    # (longest-prefix match) -- backend healthz routes live at /healthz,
    # not /api/healthz, so they need their own passthrough.
    location /api/now-assist/healthz {
        proxy_pass http://now-assist-agent:8080/healthz;
    }
    location /api/now-assist/ {
        proxy_pass http://now-assist-agent:8080/api/;
    }
    location /api/knowledge/ {
        proxy_pass http://knowledge-article-agent:8080/api/;
    }
    location /api/predictive/ {
        proxy_pass http://predictive-intelligence-agent:8080/api/;
    }
    location /api/password-reset/ {
        proxy_pass http://password-reset-agent:8080/api/;
    }
    location /api/virtual-agent/ {
        proxy_pass http://virtual-agent-demo:8080/api/;
    }
    location /api/process-mining/ {
        proxy_pass http://process-mining-agent:8080/api/;
    }
    location /api/incident-watcher/ {
        proxy_pass http://incident-watcher:8080/api/;
    }
    location /api/infra-monitor/ {
        proxy_pass http://infra-monitor:8080/api/;
    }
}
